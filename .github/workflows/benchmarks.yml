name: Benchmarks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: pnpm install --frozen-lockfile
      - name: Measure runtime, browser bundles, and type inference
        run: pnpm bench:ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-measurements
          path: bench/ci/generated/
          if-no-files-found: error
          retention-days: 14
  report:
    needs: measure
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchmark-measurements
          path: bench/ci/generated
      - name: Publish benchmark metrics with octocov
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        with:
          version: v0.83.3
          config: .octocov.benchmarks.yml
        env:
          OCTOCOV_CUSTOM_METRICS_NODE: bench/ci/generated/metrics-node.json
          OCTOCOV_CUSTOM_METRICS_BUN: bench/ci/generated/metrics-bun.json
          OCTOCOV_CUSTOM_METRICS_SIZE: bench/ci/generated/metrics-size.json
          OCTOCOV_CUSTOM_METRICS_TYPES: bench/ci/generated/metrics-types.json
      - name: Publish side-by-side benchmark comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const comment = comments.findLast(({ user, body }) =>
              user?.login === 'github-actions[bot]' && body?.includes('<!-- octocov -->')
            );
            if (!comment) throw new Error('Octocov benchmark comment was not found');
            const {readFileSync} = await import('node:fs');
            const summary = readFileSync('bench/ci/generated/summary.md', 'utf8');
            await github.rest.issues.updateComment({
              ...context.repo,
              comment_id: comment.id,
              body: `${summary}\n\n<details>\n<summary>Octocov trends and metadata</summary>\n\n${comment.body}\n\n</details>`,
            });
